<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CareerSeekho</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <!-- BRAND -->
    <div class="auth-brand">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <span>Career<span>Seekho</span></span>
      </a>
    </div>


    <!-- LOGIN CARD -->
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-icon">
          <i class="fa-solid fa-user"></i>
        </div>

        <h1>Welcome Back</h1>

        <p>
          Login to your CareerSeekho account
        </p>
      </div>


      <!-- GOOGLE LOGIN -->
      <button class="google-btn" id="googleLogin">
        <i class="fa-brands fa-google"></i>
        Continue with Google
      </button>


      <div class="divider">
        <span>OR</span>
      </div>


      <!-- EMAIL -->
      <form id="loginForm">

        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-box">
            <i class="fa-regular fa-envelope"></i>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            >
          </div>

        </div>


        <!-- PASSWORD -->
        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
            >
              <i class="fa-regular fa-eye"></i>
            </button>

          </div>

        </div>


        <div class="auth-options">

          <label class="remember">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>

          <a href="#" id="forgotPassword">
            Forgot Password?
          </a>

        </div>


        <button type="submit" class="login-btn">
          Login
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>


      <p class="signup-text">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </p>

    </div>


    <p class="auth-footer">
      © 2026 CareerSeekho. All rights reserved.
    </p>

  </div>


  <script>

    // PASSWORD SHOW / HIDE
    const passwordToggle =
      document.getElementById("passwordToggle");

    const password =
      document.getElementById("password");

    passwordToggle.addEventListener("click", () => {

      if (password.type === "password") {

        password.type = "text";

        passwordToggle.innerHTML =
          '<i class="fa-regular fa-eye-slash"></i>';

      } else {

        password.type = "password";

        passwordToggle.innerHTML =
          '<i class="fa-regular fa-eye"></i>';

      }

    });


    // TEMPORARY LOGIN DEMO
    document
      .getElementById("loginForm")
      .addEventListener("submit", (event) => {

        event.preventDefault();

        alert(
          "Login system will be connected to the CareerSeekho backend."
        );

      });


    // GOOGLE BUTTON
    document
      .getElementById("googleLogin")
      .addEventListener("click", () => {

        alert(
          "Google Login will be connected in the authentication setup."
        );

      });


    // FORGOT PASSWORD
    document
      .getElementById("forgotPassword")
      .addEventListener("click", (event) => {

        event.preventDefault();

        alert(
          "Password recovery will be connected to the backend."
        );

      });

  </script>

</body>
</html>
