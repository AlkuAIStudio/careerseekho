<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | CareerSeekho</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <!-- BRAND -->
    <div class="auth-brand">

      <a href="index.html" class="logo">

        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <span>Career<span>Seekho</span></span>

      </a>

    </div>


    <!-- LOGIN CARD -->
    <div class="auth-card">

      <div class="auth-header">

        <div class="auth-icon">
          <i class="fa-solid fa-user"></i>
        </div>

        <h1>Welcome Back</h1>

        <p>
          Login to your CareerSeekho account
        </p>

      </div>


      <!-- GOOGLE LOGIN -->
      <button
        class="google-btn"
        id="googleLogin"
        type="button"
      >

        <i class="fa-brands fa-google"></i>

        Continue with Google

      </button>


      <div class="divider">
        <span>OR</span>
      </div>


      <!-- LOGIN FORM -->
      <form id="loginForm">

        <!-- EMAIL -->
        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-box">

            <i class="fa-regular fa-envelope"></i>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <!-- PASSWORD -->
        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
            >

              <i class="fa-regular fa-eye"></i>

            </button>

          </div>

        </div>


        <!-- OPTIONS -->
        <div class="auth-options">

          <label class="remember">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span>Remember me</span>

          </label>

          <a href="#" id="forgotPassword">
            Forgot Password?
          </a>

        </div>


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >

          Login

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </form>


      <!-- MESSAGE -->
      <div
        id="loginMessage"
        style="margin-top:15px;text-align:center;"
      ></div>


      <p class="signup-text">

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>

    </div>


    <p class="auth-footer">
      © 2026 CareerSeekho. All rights reserved.
    </p>

  </div>


  <script>

    /*
      CareerSeekho Backend
    */

    const API_URL =
      "http://localhost:5000";


    /* PASSWORD SHOW / HIDE */

    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );

    const password =
      document.getElementById(
        "password"
      );


    passwordToggle.addEventListener(
      "click",
      () => {

        if (
          password.type === "password"
        ) {

          password.type = "text";

          passwordToggle.innerHTML =
            '<i class="fa-regular fa-eye-slash"></i>';

        } else {

          password.type = "password";

          passwordToggle.innerHTML =
            '<i class="fa-regular fa-eye"></i>';

        }

      }
    );


    /* LOGIN */

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document.getElementById(
            "email"
          ).value.trim();

        const passwordValue =
          document.getElementById(
            "password"
          ).value;


        loginMessage.textContent =
          "Logging in...";


        loginButton.disabled = true;


        try {

          const response =
            await fetch(
              `${API_URL}/api/login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password:
                    passwordValue
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Login failed."
            );

          }


          /*
            Save login session
          */

          const storage =
            document.getElementById(
              "rememberMe"
            ).checked
              ? localStorage
              : sessionStorage;


          storage.setItem(
            "careerSeekhoToken",
            data.token
          );


          storage.setItem(
            "careerSeekhoUser",
            JSON.stringify(
              data.user
            )
          );


          loginMessage.textContent =
            "Login successful!";


          /*
            Redirect
          */

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 700);


        } catch (error) {

          console.error(error);

          loginMessage.textContent =
            error.message ||
            "Unable to connect to server.";

        } finally {

          loginButton.disabled = false;

        }

      }
    );


    /* GOOGLE LOGIN */

    document
      .getElementById("googleLogin")
      .addEventListener(
        "click",
        () => {

          alert(
            "Google Login will be connected after Google OAuth setup."
          );

        }
      );


    /* FORGOT PASSWORD */

    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        (event) => {

          event.preventDefault();

          alert(
            "Password recovery will be added after email authentication setup."
          );

        }
      );

  </script>

</body>

</html>
