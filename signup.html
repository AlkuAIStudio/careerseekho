<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | CareerSeekho</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <div class="auth-brand">

      <a href="index.html" class="logo">

        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <span>Career<span>Seekho</span></span>

      </a>

    </div>


    <div class="auth-card">

      <div class="auth-header">

        <div class="auth-icon">
          <i class="fa-solid fa-user-plus"></i>
        </div>

        <h1>Create Account</h1>

        <p>
          Start your journey with CareerSeekho
        </p>

      </div>


      <button
        class="google-btn"
        id="googleSignup"
        type="button"
      >

        <i class="fa-brands fa-google"></i>

        Continue with Google

      </button>


      <div class="divider">
        <span>OR</span>
      </div>


      <form id="signupForm">

        <div class="input-group">

          <label for="name">
            Full Name
          </label>

          <div class="input-box">

            <i class="fa-regular fa-user"></i>

            <input
              type="text"
              id="name"
              placeholder="Enter your name"
              autocomplete="name"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <label for="signupEmail">
            Email Address
          </label>

          <div class="input-box">

            <i class="fa-regular fa-envelope"></i>

            <input
              type="email"
              id="signupEmail"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>

        </div>


        <div class="input-group">

          <label for="signupPassword">
            Password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="signupPassword"
              placeholder="Create a password"
              minlength="6"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="signupPasswordToggle"
            >

              <i class="fa-regular fa-eye"></i>

            </button>

          </div>

        </div>


        <div class="input-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            >

          </div>

        </div>


        <label class="remember signup-terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <span>
            I agree to CareerSeekho's
            <a href="terms.html">
              Terms & Privacy Policy
            </a>
          </span>

        </label>


        <button
          type="submit"
          class="login-btn"
          id="signupButton"
        >

          Create Account

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </form>


      <div
        id="signupMessage"
        style="margin-top:15px;text-align:center;"
      ></div>


      <p class="signup-text">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>

    </div>


    <p class="auth-footer">
      © 2026 CareerSeekho. All rights reserved.
    </p>

  </div>


  <script>

    const API_URL =
      "http://localhost:5000";


    /* PASSWORD SHOW / HIDE */

    const signupPasswordToggle =
      document.getElementById(
        "signupPasswordToggle"
      );

    const signupPassword =
      document.getElementById(
        "signupPassword"
      );


    signupPasswordToggle.addEventListener(
      "click",
      () => {

        if (
          signupPassword.type === "password"
        ) {

          signupPassword.type = "text";

          signupPasswordToggle.innerHTML =
            '<i class="fa-regular fa-eye-slash"></i>';

        } else {

          signupPassword.type = "password";

          signupPasswordToggle.innerHTML =
            '<i class="fa-regular fa-eye"></i>';

        }

      }
    );


    /* SIGNUP */

    const signupForm =
      document.getElementById(
        "signupForm"
      );

    const signupMessage =
      document.getElementById(
        "signupMessage"
      );

    const signupButton =
      document.getElementById(
        "signupButton"
      );


    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const name =
          document.getElementById(
            "name"
          ).value.trim();

        const email =
          document.getElementById(
            "signupEmail"
          ).value.trim();

        const password =
          document.getElementById(
            "signupPassword"
          ).value;

        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;


        if (password !== confirmPassword) {

          signupMessage.textContent =
            "Passwords do not match.";

          return;

        }


        if (password.length < 6) {

          signupMessage.textContent =
            "Password must be at least 6 characters.";

          return;

        }


        signupMessage.textContent =
          "Creating your account...";

        signupButton.disabled = true;


        try {

          const response =
            await fetch(
              `${API_URL}/api/signup`,
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  name,
                  email,
                  password
                })

              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Signup failed."
            );

          }


          signupMessage.textContent =
            "Account created successfully!";


          setTimeout(() => {

            window.location.href =
              "login.html";

          }, 1000);


        } catch (error) {

          console.error(error);

          signupMessage.textContent =
            error.message ||
            "Unable to connect to server.";

        } finally {

          signupButton.disabled = false;

        }

      }
    );


    /* GOOGLE SIGNUP */

    document
      .getElementById("googleSignup")
      .addEventListener(
        "click",
        () => {

          alert(
            "Google Sign Up will be connected after Google OAuth setup."
          );

        }
      );

  </script>

</body>

</html>
